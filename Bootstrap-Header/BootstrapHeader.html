<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <title>BootStrap</title>
    <style>
        *{
            margin: 0;
            padding: 0;

        }
        .bi-bootstrap-fill{
            color: purple;
            margin-left: 20px;
            font-size: 35px;
        }
        header{
            background-color:#000000;
            display: flex;
            padding: 10px;
            flex-direction: row;
            justify-content: space-between;
            justify-items: center;
            align-items: center;
            border-radius: 10px
        }
        nav{
            display: flex;
            align-items: center;
        }
        nav span{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: #585757;
            font-size: 16px;
            font-weight: bold;
            margin-right: 30px;
        }
        .search-bar{
            background-color: #4a4a4a;
            padding: 5px;
            border-radius: 5px;
            width: 200px;
            color: rgb(172, 167, 167);
        }
        .btn-k{
            font-size: 10px;
            background-color: rgba(0, 0, 0, 0.55);
            border-radius: 5px;
            margin-left: 60px;
            padding:inherit;

        }
        .bi-search{
            font-size:14px;
        }

        .bi-github , .bi-moon , .version{
            color: white;
            font-size: 20px;     
            margin-right: 30px;       
            justify-content: space-around;

        }


    </style>
</head>
<body>
    <header>
        <div>
            <nav>
                <span class="bi bi-bootstrap-fill"></span>
                <span>Docs</span>
                <span>Example</span>
                <span>Example</span>
                <span>Icons</span>
                <span>Blog</span>
            </nav>
        </div>
        <div class="search-bar">
            <span class="bi bi-search"> Search docs...</span>
            <span class="btn-k">ctrl K</span>
        </div>
        <div>
            <span class="bi bi-github"></span>
            <span class="version">v5.3.0</span> 
            <span class="bi bi-moon"></span>


        </div>
    </header>
    
</body>
</html>
