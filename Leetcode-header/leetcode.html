<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Signature&display=swap" rel="stylesheet">
    <title>Leetcode</title>

    <style>
        body{
            background-color: rgb(155, 156, 155);
            font-family: Arial, Helvetica, sans-serif;
        }
        header{
            padding: 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            font-size: 18px;
        }
        header span{
            margin-right: 10px;

        }
        .bi-bug , .bi-play-btn-fill ,.bi-cloud-arrow-up ,.bi-file-earmark,.bi-star-fill ,.bi-columns-gap .bi-gear , .timer{
            background-color: #c1c1c1;
            border-radius: 3px;
            padding: 5px;
        }
        .btn-premium{
            background-color: #fff2c2;
            padding: 5px;
            color:#c89404 ;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <span class="bi bi-javascript"></span>
            <span>30 days of javascript</span>
            <span class="bi bi-chevron-bar-left"></span>
            <span class="bi bi-chevron-bar-right"></span>
            <span class="bi bi-shuffle"></span>
        </div>

        <div>
            <span class="bi bi-bug"></span>
            <span class="bi bi-play-btn-fill"></span>
            <span class="bi bi-cloud-arrow-up"></span>
            <span class="bi bi-file-earmark"></span>
            <span class="bi bi-star-fill"></span>
            <span class="bi bi-columns-gap"></span>
            <span class="bi bi-gear"></span>
            <span class="timer">
                <span class="bi bi-chevron-left"></span>
                <span class="bi bi-pause-fill"></span>
                <span >688.45.09</span>
                <span class="bi bi-arrow-repeat"></span>
                <span class="bi bi-three-dots-vertical"></span>
            </span>
            <span>Register to login</span>
            <span class="btn-premium">Premium</span>
        </div>
    </header>
    
</body>
</html>
